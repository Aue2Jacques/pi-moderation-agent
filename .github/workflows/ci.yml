# Engineering gate (owner decision 2026-10-08, stage-1 acceptance): must be green. The real-judge contract — a model
# quality check — runs in model-quality.yml and is reported separately; it does not gate this workflow.
name: ci
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run test:unit
      - run: pnpm run test:harness
      - run: pnpm run redact-scan
      - run: bash scripts/fetch-fixtures.sh   # fixtures present and not stale: an engineering check
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run pytest -q   # tests exist now (python/eval); "no tests ran" is no longer accepted
