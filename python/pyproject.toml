[project]
name = "pi-moderation-eval"
version = "0.0.0"
description = "synth data, evaluation runners, replayer (read app.db / write intake only)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "simhash>=2.1",
    "zhconv>=1.4.3",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["synth", "eval", "replay"]
